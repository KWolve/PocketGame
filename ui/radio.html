  PocketGame - 网络收音机（独立 ftu：radio.ftu -> radioActivity）
  源稿: html2json.py -> ui/radio.json -> fui pack -> ui/radio.ftu

  两个窗口：
    WinRadio     —— 电台列表页（默认显示）
    WinRadioPlay —— 播放页（初始隐藏；2026-09-18 改版：大圆盘 + 30 段真 FFT 频谱 + 圆形控制键）

  ⚠️ WinRadioPlay 必须留在 gen_ui.py 的 HIDDEN_PAGE_WINDOWS（进页先看到列表页）；
     WinRadio **不能**列在那里（列了进页就是一片空白）。
  ⚠️ 本文档只给工具读：看效果请开 radio.preview.html。

  ★ 电台表（见 radioLogic.cc 的 radioLoadStations）：
     ① `/data/radio.txt` 优先 —— 每行 `名称|地址`（也接受只写地址，名称自动取域名）；
        以 # 开头的行是注释。用 QA 通道 `radiosave <名称>|<地址>` 也能往文件里追加。
     ② 没有文件时用内置示例台（radioLogic.cc 的 kBuiltinSta）。
  ★ 播放链路：**直接用 pg::StreamPlayer::startDecodeTest(url, 0)** ——
     PgStream 已经实现"纯音频源跳过 MPP/硬解/显示，只解音频"（PgStream.cpp 的
     `if (!hasVideo)` 分支），音频走 ffmpeg 软解 → 重采样 22050/单声道/S16 →
     那条常开 PCM 流（PgAudio）。**不需要 videoview**，本页也没有视频层。
  ★ 本页全部是 FlyThings 原生控件（底色 data-bg + 文字），不引自定义绘图。
  ★ **频谱是真的**：PgAudio::streamWrite（喇叭里真正要放的那块 PCM）→ `pg::Viz`
     做 512 点 FFT → 30 段对数分频 → 播放页每拍把第 b 段映射成第 b 根柱子的高度。
     所以"静音/没出声 ⇒ 频谱不动"，不存在"假动画"。素材 tools/gen_radio_art.py。
-->

    <!-- ==================== ★ 双指针 VU 表（2026-09-19，同日"压扁"改版） ====================
         用户第一版反馈：「频谱和 db 值部分做成两个左右声道的指针仪表效果，浅黄色模拟真实仪表」。
         用户第二版反馈（本版）：「**表盘盖住了其他控件：控制按键、电台时间都被盖住了**」。

         ⇒ 布局预算（本页从上到下的硬边界）：
             已播时长 424..454 ┊ 总电平条 454..462 ┊ **仪表区 464..620** ┊ 控制键 620..724
           上一版是 226x226 方盘 @y=408..634 ⇒ 把"已播时长"和"总电平条"**整条压住**，
           下沿还伸进控制键那一排。本版压成 **226x128 @y=468**，读数窗挪到面盘下方 597..618。
           （判据是 `tools/gen_vu_art.py --check`：它会把布局预算写成断言，越界就报错。
             `tools/check_overlap.py` 也能查出来 —— 上一版漏掉正是因为那个脚本有 bug，已修。）

         ⚠️ **"压扁"不能把圆压成椭圆**：指针是整张图绕铰点转，**刻度弧必须是正圆**，
            否则弧上各点到铰点的距离随角度变、针尖会离开刻度。
            真表"扁"的做法是**大半径浅弧** —— 铰点挪到面盘**下边缘之外**（局部 y=142 > 128），
            半径加到 120 ⇒ 盘内只露出弧的顶部一段，观感扁宽而几何严格。
            两条不能破的等式：**圆心 == 铰点**、**针长 == 弧半径 + 3**。

         三层结构（**声明顺序 = 叠放顺序**）：
           ① 表盘底 `VuFaceL/R`（226x128，浅黄面盘 + 刻度弧 + 红区 + VU + L/R 圆标）
           ② 指针 `VuNeedleL/R`（**ZKPointer 控件**：234x234 透明图，铰点在图片正中）
           ③ 读数 `TextVuDbL/R`（在**面盘下方**，不是盘内 —— 盘内那圈会被针扫过去）

         ⚠️ 指针控件的坐标三件套（**MCP 知识库 `uicontrols/pointer-fields.md` 的口径**）：
            `rotationPoint=(117,117)`（控件系旋转圆心）、`fixedPoint=(117,117)`（指针图系铰点）。
            控件左上 = 面盘左上 + PIVOT − 117 = +(0, 25)，即铰点落在面盘的 (117,142)。
            ★ `data-x` **不能是负数**、右盒也不能出屏（`check_bounds.py` 的闸）——
              这两条把半径**卡死在 110**（`gen_vu_art.py` 里写了推导），`--check` 有断言。
         ⚠️ `animatable=0`：指针由本页 25ms 定时器驱动（VU 弹道在 PgViz 里做），
            不用控件自带的匀速旋转（那是给加载图标/时钟针用的）。
         ⚠️ 这两只表与上面那组频谱**同一区域、按视图模式互相显隐**（见 radioLogic 的 syncView）。
         ⚠️ 指针控件盒（234x234，会盖到下面那排控制键）**不影响按键触摸** ——
            2026-09-19 真机实测：命中的是**最上层**控件，指针声明在前 ⇒ 按键照样收到点击
            （`pginj tap` 在 y=630（盒内）与 y=710（盒外）都能换台）。别为此缩盒。 -->
