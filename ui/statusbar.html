<!--
  PocketGame - 全局状态栏（SysApp：statusbar.ftu -> statusbar，APP_TYPE_SYS_STATUSBAR）
  源稿: html2json.py -> ui/statusbar.json -> fui pack -> ui/statusbar.ftu

  ★ 2026-09-14 用户要求：「音量弹框做成全局的，可以用状态栏实现。现在的音量弹框在其他界面看不到。」
    做法 = 官方状态栏机制（`EASYUICONTEXT->showStatusBar()` + 一个 statusbar SysApp）：
    fun 会自动把 ui/statusbar.html 注册成 APP_TYPE_SYS_STATUSBAR（见 .fun/v85x/generated/ui_statusbar.cpp），
    它是**悬浮在所有页面之上**的浮层 ⇒ 在任何 ftu（wifi / 工具页 / 套件 / IPTV / 投屏…）按音量键都看得见。

  ⚠️ 根属性现状（gen_ui.py 会 patch，别手动去掉）：
    · **不写 data-bg** ⇒ 整屏透明（html2json：「不写则透明」，官方就是给 navibar/statusbar 留的）；
    · `touchable = false` —— 它**不是**触摸穿透！实测（2026-09-15）：整屏 topmost 窗口写
       `touchable=false`、甚至运行时补 `setTouchPass(true)` 都放不过触摸 ⇒ 只要状态栏
       **显示着**，整机所有页面的控件都点不动（页面级回调照常 ⇒ "报点正常、控件无响应"）。
    · `topmost = true` / `modal = false` ⇒ 在最顶层、但不是模态（模态是输入黑洞，历史坑）。

  ★ 因此显隐策略是**按需**（2026-09-15 定稿，见 src/logic/statusbar.cc 的 showOsd）：
    平时 `hideStatusBar()`（窗口栈里没有它 ⇒ 不挡触摸），只在音量 OSD 那 1.6 秒里
    `showStatusBar()`；超时或**点面板外**立刻收起。别改回"常显 + 穿透"。

  ⚠️ 音量 OSD 的显隐由 src/logic/statusbarLogic.cc 控制（默认隐藏，音量变化才弹出、1.6s 自动消失）。
     这里只放这一个面板 —— 状态栏**不要**放常驻内容，免得挡住下面页面的标题栏。
  ⚠️ 本文件只给工具读：看效果请开 statusbar.preview.html。
-->

  <!-- ==================== 全局音量 OSD（全工程唯一一份） ====================
       ★★ 2026-09-16 第二版（用户：「音量弹出框效果参考手机修改，现在的显示效果太差了。
          可以做成半透的加进度条」）——旧版观感差的三个实证来源：
            ① 面板底色是**不透明** `#1C1C1E` ⇒ 与背后页面糊成一块，没有"浮层"感；
            ② 进度条 **20px 粗、四角无圆角、两个纯色方块**，填充右端是**硬切口**；
            ③ 面板 240x160 太大、信息挤。
          新版 = **半透明圆角面板 + 手机风格细进度条（10px 胶囊 + 圆头）**：
            · 面板底：`BtnSbPanelBg`（button + picTab 挂 `osd_panel.png` —— MCP 实测结论：
              **真透明装饰件用 button + picTab 才 alpha 混合正确**；直接写 `data-bg` 的
              JSON 颜色链路上 alpha 不可控）。
              ⚠️ 它是最底层（所以**第一个**定义）；装饰件本身不可点：`data-untouchable="1"`
              ⇒ gen_ui 会把它设成 `touchable=false`。
              ★★ 这里**故意不加 `setTouchPass(true)`**（与"MCP 装饰件要放行"的通例相反）：
                 面板必须**吸收**落在它身上的触摸 —— 否则点面板空白处会穿透到下面页面
                 （比如把游戏卡片点了、直接进游戏）。放行的只有"点面板外收起"那套逻辑，
                 它走的是窗口命中（窗口就只有面板这么大），与控件穿透无关。
            · 进度条：`data-track` 半透明白胶囊轨道 / `data-fill` 实色胶囊填充。
              ★★ **不要给 seekbar 加 `data-thumb`**（真机实测的教训）：
                ZKSeekBar 的填充图是**按进度把整张图缩放**（不是裁剪）⇒ 胶囊两端
                天然就是圆的，观感已经对；而圆钮会被画在"进度位置"上（左边缘对齐），
                于是 **0% 时也留一个 10px 白点**（实测 vol=0 的填充宽 10px、期望 0）。
                另外 html2json 见到 `data-thumb` 还会**自动把 seekbar 置 touchable=true**
                （"可拖滑块"），与"条只负责显示"的设计冲突。
            · 布局照手机：图标 + "音量" + 百分比一行，细条一行，静音一行。
           ⚠️ 窗口仍是 **240x112**（= 面板大小，不是整屏）：常显浮层只有窗口这么小，
              才不会吃掉全机触摸。位置由 tools/gen_ui.py patch 成 (120,544)
              （视觉中心仍在 y≈600，与旧版一致）。 -->

    <div class="btn" data-caption="BtnSbPanelBg" data-x="0" data-y="0" data-w="240" data-h="112"

           琥珀色与状态栏"充电中"那一档同色，视觉上是一套。 -->

    <div class="btn" data-caption="BtnSbVolIcon" data-x="16" data-y="46" data-w="32" data-h="32"
