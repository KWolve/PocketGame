<!--
  PocketGame - 自定义输入法（ime.ftu / 480x800 竖屏）
  源稿: html2json.py -> ui/ime.json -> fui pack -> ui/ime.ftu

  为什么需要它：本板系统内置 IME 在 480x800 竖屏下**超出屏幕边界**（用户实测）。
  官方做法是做一个 `APP_TYPE_SYS_IME` 的 SysApp —— 系统在任何 ZKEditText 聚焦时
  **自动拉起**它，我们不需要在任何地方手动 showIME()。

  ⚠️ 铁律：**非游戏功能一律用原生控件，禁止自定义绘图**。所以这里全是 `div.btn`
     （ZKButton），没有任何画布。「按键序号 -> 字符/动作」的对应关系在
     `src/logic/imeApp.cc` 的 kKeyChar[] 里（按键靠 pBase->getID() 查表）。

  ⚠️ 页面名必须是 `ime`：`src/logic/imeApp.cc` 里手写 `REGISTER_SYSAPP(APP_TYPE_SYS_IME, ...)`，
     getAppName() 返回 "ime.ftu"。fun 生成器本身**不认 ime 这个 sysapp 类型**
     （它只认 screensaver/statusbar/navibar），所以它会为这个页面额外生成一个
     普通 activity（ui_ime.cpp 里的 REGISTER_ACTIVITY）——那个是惰性的、不参与本功能。

  ⚠️ 根节点**故意不写 data-bg**：html2json 对 .screen 不写背景就**不设 backgroundColor**，
     即键盘上方区域是**透明的**，能透出下面的输入对话框（框架按 Z 序合成）。
     键盘面板自己带底色（KbPanel）。

  ======================== 2026-09-23 改版：加中文拼音输入 ========================
  用户要求「改名可以让用户自己输入，FlyThings 支持中文输入」⇒ 给自研 IME 加**全拼**。

  版面（面板 y=372..800，高 428；上方 372px 透明留给对话框）：
      面板内 y    内容
      ---------------------------------------------------------------
        4..48    ① 候选条：**5 格 x 92 宽**（BtnCand0..4），x = 8 + 94*i
       54..92    ② 回显行：输入回显 / 中文·英文 / 清空 / 收起
       98..136   ③ 功能行：拼音缓冲回显 / 上页 / 下页
      142..426   ④ 键区：5 行 x 10 列，键 41x52，行距 58（x = 8 + 47*i）

  ★ 为什么键区选 y=142：面板从 424 抬到 372（**上抬 52px**），键区跟着下移 52px，
    于是**键的绝对坐标一个都没变**（514/572/630/688/746）—— 既加了新行，
    又完全不动用户已经习惯的键位。改这里前先算一遍绝对坐标。

  ★ 为什么候选条 5 格（2026-09-24 由 6 格 x 76 改来）：**4 字词装不下**。
    词组候选里 4 字词是常态（客厅窗帘 / 客厅灯带 / 智能门锁 / 空气净化器 的前 4 字），
    字号 20 时「客厅窗帘」宽 80px、格宽只有 76px ⇒ 实测**尾巴被裁**（抓屏上亮像素
    正好铺满 76px，就是顶到格边被切）。92px @ 字号 22 放 4 个汉字（88px）刚好。
    代价是每页少 1 个候选（6→5），翻页交给「上页/下页」。
    ⚠️ 别再往下减格数：3 格 = 152px 会让候选条看起来像"只有三个词"。

  ⚠️ 文案黑名单（构建期就会静默丢字符，见 tools/check_textblack.py）：
     ⌫ ℃ ■ ● ‹ － ＋ – … → ★ ◆ ▶ ▷ ①  —— **本文件里一个都不能出现**。
     所以翻页写「上页/下页」而不是箭头、退格写「退格」而不是 ⌫。

  控件命名：caption -> m<Caption>Ptr / ID_IME_<Caption>；键位按行列编号 BtnK<序号>。
  ⚠️ 本文件只给工具读：看效果请开 ime.preview.html。
-->
