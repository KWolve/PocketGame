<!--
  PocketGame - 局域网摄像头查看（独立 ftu：camera.ftu -> cameraActivity）
  源稿: html2json.py -> ui/camera.json -> fui pack -> ui/camera.ftu

  两个窗口：
    WinCam     —— 扫描页（默认显示）：局域网里"疑似摄像头"的设备列表
    WinCamView —— 查看页（初始隐藏）：videoview 透明窗口 + 地址探测提示 + 底部三键

  ⚠️ WinCamView 必须留在 gen_ui.py 的 HIDDEN_PAGE_WINDOWS（进页先看到扫描页）；
     WinCam **不能**列在那里（列了进页就是一片空白）。
  ⚠️ ImgCamCover（缓冲底图）必须留在 gen_ui.py 的 HIDDEN_CONTROLS：它是**不透明**的
     480x700 大图，压在 videoview 上，不首帧隐藏就会一直挡着视频。
  ⚠️ 本文档只给工具读：看效果请开 camera.preview.html。

  ★ 链路（全部复用工程里已验证的模块，本页不新增任何底层）：
     ① 找设备：`pg::Lan` —— 邻居发现（UDP 广播 → /proc/net/arp）+ 摄像头端口扫描
        （554/8554/8000/34567…）+ RTSP DESCRIBE 指纹（回 200/401 且带 m=video
        = 坐实"这是一路视频流"）。列表里只显示**端口带 554/8554** 的设备。
     ② 找地址：worker 线程用 `pg::Ff::probeFast()` 逐个试常见 RTSP 路径
        （`/`、`/stream1`、`/11`、`/h264/ch1/main/av_stream`、`/cam/realmonitor?…`、
        `/onvif1`、`/live/ch0` …）—— 第一轮不带密码，全失败再带一组常见默认口令重试。
     ③ 出画面：`pg::StreamPlayer::startWithDisplay(url, 0, 0, 0, 480, 700)` ——
        ffmpeg 解封装（**rtsp 解封装在本板 ffmpeg 里是编进去的**）
        → 设备硬解（zk_h264_player）→ disp 视频层 → 从 `CamVideo` 这个
        **UI 层透明窗口**透出来。
        ⚠️ 起流必须在 **UI 线程**里发起（startCommon 要在 UI 线程拿回声卡），
           所以 worker 只负责"探测地址"，探测结果由 onUI_Timer 取走再起流。

  ★ 判断"真的出画了"：`pg::H264Player::framesDecodedInRun() > 0`（**别用累计值做减法**，
    清零在子线程里，自己记基线会有竞态，见 docs/iptv.md §11.4.4）。
  ★ 想抓一帧证据：QA `camgrab` → `StreamPlayer::requestGrab(30)` 落 /tmp/pgframe.pgm
    （视频层不在 /dev/fb0，普通截图抓不到画面）。
-->

    <div class="icon" data-caption="ImgCamCover" data-pic="images/video_cover.png"

  <!-- ==================== ③ 账号密码弹窗（初始隐藏） ====================
       为什么需要：**要 Digest 鉴权的摄像头**（海康/大华…）自动探测拿不到 URL ——
       不带凭据时它只回 401，带凭据才给 SDP。这一页让用户**在设备上直接输入**
       （不用 adb 写 /data/camera.txt）。

       布局/写法**整段照抄 ui/wifi.html 的密码弹窗**（那边已经把坑踩完了）：
         · **普通 window，不是 modal** —— modal 是输入黑洞（历史坑）；
         · 所有可交互控件必须落在 **y < 424**：下半屏（y≥424）是自定义 IME
           （src/logic/imeApp.cc + ui/ime.html）画键盘的地方，压过去就点不到；
         · 弹窗 window 的 `touchable` **必须保持 false** —— 整屏窗口一旦可触摸，
           连键盘区域的触摸都会被本 Activity 吃掉，IME 就再也收不到按键
           （"wifi 键盘敲不进字"的老血案）。代价是**窗口里的按钮收不到点击**，
           所以四个可交互区在 cameraLogic.cc 的 `oncameraActivityTouchEvent` 里
           **按坐标手动分发**——那里的数字必须与这里的控件盒逐个对齐，改布局要一起改。
         · `div.input` 是**原生 ZKEditText**（点它 → 系统调起 IME，不需要代码 showIME，
           但本页仍显式拉起一次，见 showCamPwdIme：框架的自动拉起是间歇性的）。
         · ★★ `div.input` 的 `data-bg` **必须写 #1C1C1E**：框架画 .9.png 时整圈跳过
           1px marker 边 ⇒ 控件最外 1px 露的是**控件自己的底色**，而 input 的
           引擎默认底色是**白色**（bgColorTab=0xFFFFFF）⇒ 不写就露一圈白框。
           这里它坐在 `data-round="panel"`（#1C1C1E）的卡片上，露 #1C1C1E 正好无缝。
  -->
  <div class="window" data-caption="WinCamPwd" data-x="0" data-y="0" data-w="480" data-h="800" data-bg="#000000">
    <!-- 卡片底 410 < 424：不能压到键盘区 -->
    <div class="text" data-caption="CardCamPwd" data-round="panel" data-x="40" data-y="110" data-w="400" data-h="300"></div>

         data-fs="13" data-color="#9A9AA0" data-align="center"></div>
    <div class="input" data-caption="EditCamUser" data-round="panel2c" data-bg="#1C1C1E"
         data-x="60" data-y="184" data-w="360" data-h="52" data-hint="账号" data-fs="18" data-color="#F2F2F7"></div>
    <div class="input" data-caption="EditCamPwd" data-round="panel2c" data-bg="#1C1C1E"
         data-x="60" data-y="244" data-w="360" data-h="52" data-password="1" data-hint="密码"
         data-fs="18" data-color="#F2F2F7"></div>
    <div class="text" data-caption="TextCamPwdMsg" data-x="60" data-y="300" data-w="360" data-h="22"
         data-fs="13" data-color="#FF453A" data-align="center"></div>
    <div class="btn" data-caption="BtnCamPwdCancel" data-x="60" data-y="328" data-w="170" data-h="52"
         data-bg="#2C2C2E" data-fs="17" data-color="#F2F2F7">取消</div>
    <div class="btn" data-caption="BtnCamPwdOk" data-x="250" data-y="328" data-w="170" data-h="52"
         data-bg="#30D158" data-fs="16" data-color="#000000">保存并播放</div>
  </div>

</div>
