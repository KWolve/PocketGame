  ★ 2026-09-16 用户需求演进：

        ⇒ 本页从「只有 WiFi」扩成**完整状态栏**：【页面标题(左) + 电量 + WiFi(右)】。
        这样各页面不用再显示自己的标题/电量 —— 而那本来就放不下（见下条）。

  ⚠️⚠️ 为什么各页的标题会被"切掉半截"（用户说的"显示不完整"）：
     导航栏是**常显浮层**，它的窗口（480x52）是不透明黑底；而各页自己的标题画在
     y=8~18（fs=20~22，墨迹约 10~42）⇒ 上半被本页盖住、下半露出来 = 半截标题。
     ⇒ 正解就是用户说的：**标题统一在本页显示**，各页不用再画（本页标题由
        navibar.cc 按 `EASYUICONTEXT->currentAppName()` 动态写）。
     ⚠️ 反过来说：**本页高度只能到 52**（再多就把页面内容也压掉了）。
        各页面从 **y≥52** 放内容（见各自的 html）。

  ★★ 2026-09-16 第二轮「检讨 UI 覆盖」（用户需求：「把 Ui 目录下的 json 布局全部检讨
     一遍…navibar 是盖在 UI 上面的，检讨有 UI 区域覆盖的情况下告警并修复」）：
     上一次只改了**逻辑**，没回头扫**布局** —— 结果 11 个页面的顶部大标题盒仍是
     `y=8 h=52`（盒 8..60），被本条盖到 52 ⇒ 在状态栏下沿**露出一条 8px 的 #1C1C1E 横带**
     （真机实测抓到了）。这次的处理：
       · 11 处同位置标题盒 ⇒ `data-h` 52→44（**收进本条覆盖区**，残带消失；标题仍由本页显示）；
       · 「页面专属名字」不在 kTitleMap 里的两处（游戏名 / "世界时钟"子页名）⇒
         新增 `pg::setNaviTitle()` 覆盖通道（见 src/platform/PgNavi.h）；
       · 三个视频播放页（480x700 @y=0、等比铺满）⇒ 播放期间**由本页自己收起来**
         （`pg::setVideoPage()`），把画面顶部 52px 让出来；
       · 判据固化成 `tools/check_overlay.py`，并接进 `tools/gen_ui.py` 的检查链防回归。

  ⚠️⚠️ 这个文件最关键的一条是 **root 的 data-res**：
    导航栏是**常显**的（不像 statusbar 那样按需显隐），而整屏浮层一旦显示就吃掉
    **全机控件级触摸**（血案见 statusbar.ftu 的注释：touchable=false / setTouchPass(true)
    都拦不住）。所以这里把根节点做成 **480x52**：窗口就只有那一条，
    挡住的也只是屏幕顶部 52px，下面的页面照常能点。
    ★ 验收判据（改完必须真机验）：导航栏显示着时，主界面的 tab 与列表项**照常能点**。
    ⚠️ 别把它改成 480x800（那会变成第二个"整机点不动"的血案）。

  ⚠️ 内容只放**状态**（标题 / 电量 / WiFi），不放可点按钮 —— 常显浮层上的按钮会被自己吃掉触摸。
     要按钮的话见 statusbar（音量 OSD）那套「按需显隐」。

  ⚠️ 本文件只给工具读：看效果请开 navibar.preview.html。
