  PocketGame - 时钟套件（独立 ftu：clocksuite.ftu -> clocksuiteActivity）
  源稿: html2json.py -> ui/clocksuite.json -> fui pack -> ui/clocksuite.ftu

  为什么独立：主界面拆分口径 =「游戏不动，其余功能界面全部独立成 ftu」
  （见 docs/page-split-plan.md）。逻辑在 src/logic/clocksuiteLogic.cc。

  ⚠️ 响铃提醒页 WinAlarmRing **不在这里**，仍在 main.ftu：闹钟是跨页面的
     （pg::Alarm 守护线程在任何页面都会响），提醒页由主循环 tickAlarmRing() 弹出 ——
     它属于"整屏浮层"（与音量 OSD 同类）。本页在响铃期间会**自动收掉自己**让位，
     回主界面后由主循环把提醒页弹出来（见 clocksuiteLogic.cc 的 onUI_Timer）。

  ⚠️ 两个窗口都用普通 window（**不用 modal**：modal 是输入黑洞）。
     WinClockSuite 是主页（默认显示）；WinWorld 初始隐藏 —— html2json 对 div.window
     实际给 visible:true，所以 WinWorld 仍要列进 tools/gen_ui.py 的 HIDDEN_PAGE_WINDOWS
     （WinClockSuite 已从那份清单里去掉，否则进页看到的是空白）。

  ⚠️ 本文件只给工具读：看效果请开 clocksuite.preview.html。
-->
