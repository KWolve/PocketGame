  PocketGame - 番茄钟（独立 ftu：pomodoro.ftu -> pomodoroActivity）

  为什么独立出来（2026-09-14，见 docs/page-split-plan.md）：
    主界面 main.ftu 里塞了 11 个整屏窗口（游戏页 / 三种时框架方具 / 计算器 / 反应计时 /
    时钟套件 / 网络电视 / 投屏 / 音量 OSD），一个 json 4461 行。现在的口径是
    **游戏不动，其余功能界面全部独立成 ftu** —— 本页就是第一个。

  逻辑全在 src/logic/stopwatchLogic.cc，用的是通用外壳 pg::ToolPage
  （每帧同步 / 按键 / 长按返回 / 关屏保，见 src/ui/ToolPage.h）。

  版式（按 docs/ui-design-baseline.md，与主界面里的工具页保持同一套规矩）：
    · 顶栏 0..60（#1C1C1E）+ 阶段色条 0..8（logic 按状态改色）
    · 大钟是**唯一主角**：88px，y=130..282
    · 状态行 / 副行（计次信息）紧随其后
    · **按钮沉底**：2 行 x 4 列，键 108x80，行距 16、列距 8（间距只用 6/8/16）
      —— 原来这排键浮在屏中间，上下各留一大片空白（"按键都布局中"）
    · 底部键位条 700..800
  ⚠️ 看效果开 stopwatch.preview.html；本文件一行 CSS 都没有，只给工具读。
-->
