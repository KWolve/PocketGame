<!-- ============================================================================
  屏保页（APP_TYPE_SYS_SCREENSAVER 的 SysApp，见 src/logic/screensaver.cc）
  2026-09-18 改成「超级玛丽砖块钟」：需求原文见 tools/gen_marioclock.py 的文件头。

  布局总览（480x800）：
     y   0.. 56  顶部黑条 HUD（SMB 计分板风）—— 日期 / 星期白字直接写在上面
     y 180..320  4 位数字砖块 + 冒号（砖块是底板，数字是另一层，能独立飞出去）
     y 320..540  天空（**金币飞行走廊**：云/月亮一律不许放进来，见 gen_marioclock.py）
     y 540..600  悬空砖台：马里奥走在这上面，从左边走进来
     y 690..800  地面砖
   动画（纯绝对时钟推导，不累加 dt —— 见 screensaver.cc 顶部注释）：
     T-3.0s 马里奥从屏幕左外走进来 → T-0.7s 到第 4 块砖正下方起跳
     T-0.0s 头撞到砖块 → 旧数字当金币飞出（横向压扁=旋转）+ 砖块上顶一下
     T+0.4s 新数字落下 → T+1.9s 马里奥走出屏幕右边

  ⚠️ 本页所有控件都用 class="icon"（= textview + 背景图，touchable=false）：
     ① 不需要任何点击回调 ⇒ 生成代码里不会出现 onButtonClick_*（少 46 个空函数）；
     ② touchable=false ⇒ 不会吃掉"任意触摸唤醒屏保"的那一下（原来 82 个按钮全是 true）。
     ⚠️ 数字/马里奥**必须能改位置与尺寸**（金币压扁靠改宽度），textview 的 backgroundPic
        同样按控件盒缩放 —— 与翻页钟原来用 btn + setPosition 是同一个机制。

  ⚠️ 初始可见性不写在 html 里（转换器不支持 data-visible）：由 tools/gen_ui.py 的
     patch_flipcards()（只留数字 0 与 ColonOn）与本文件的 HIDDEN_CONTROLS 决定。
============================================================================ -->
<div class="screen" data-res="480x800" data-bg="#000000">

       所以页面底色 data-bg 只在两套图都还没上屏的那一瞬间可见。 -->
  <div class="icon" data-caption="SaverBgNight" data-x="0" data-y="0" data-w="480" data-h="800"
       data-pic="images/saver_bg_night.png"></div>

       data-pic="images/saver_bg_day.png"></div>
