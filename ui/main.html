                          backgroundPic 清掉）。它们的圆角由 src/platform/PgSkin.h 在
                          "设底色"的那一刻顺手挂上。

     拖控件微调 ->  ui/_edit/main.edit.html
     改布局    ->  改本文件后跑 tools/gen_ui.py（不要直接改 main.json，会被覆盖）
