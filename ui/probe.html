  PocketGame - WiFi / 蓝牙信号探针（独立应用，probe.ftu / 480x800 竖屏）
  源稿: html2json.py -> ui/probe.json -> fui pack -> ui/probe.ftu
  一个 Activity = 一个 ftu：probeActivity（EventApp<Activity>("probe")）加载 probe.ftu。

  功能参考 iOS「Find Spy 隐藏设备探测器」，全部用 **FlyThings 原生控件**实现
  （铁律：非游戏功能禁止自定义绘图）。四个页签 + 一个整屏浮层页：

    1) WiFi 探测页（WinProbeWifi，默认可见）
       附近网络总览（2.4G/5G 分布、可疑数、开放数、推荐信道）+ 按强度排序的 AP 列表
       （频段 / 信道 / SSID / 加密 / dBm / 风险标记）
    2) 蓝牙探测页（WinProbeBt，初始隐藏）
       BT 状态卡（初始化状态 / 广播条数 / 周边设备数）+ BLE 设备列表
    3) 局域网设备页（WinProbeLan，初始隐藏）★ 2026-09-15 新增
       **主动探测**：连进同一张网后扫在线设备（邻居发现 → /proc/net/arp 拿 IP+MAC）
       → MAC 厂商 OUI → 摄像头端口扫描 + **RTSP/HTTP 协议指纹**
       ⇒ 这是"找 STA 型偷拍设备 / IP 摄像头"的正解（AP 扫描根本看不见它们）
    4) 无线嗅探页（WinProbeSniff，初始隐藏）★ 2026-09-15 新增
       把闲置的 wlan1 切成 MONITOR 顺听空口（不碰 zknet/wlan0）：
       同信道所有发射者（含平时完全隐身的 STA）+ 真实 RSSI + 信道 +
       **probe/assoc 里的明文 SSID**（隐藏网络的名字就是这么解出来的）
    5) 热点猎手（WinHunt，整屏浮层）
       锁定一个目标（AP / BLE / 局域网设备）后实时刷新 RSSI，用「大号 dBm +
       12 段强度条 + 提示语 + 蜂鸣」帮你**物理上找到**它（信号越强 = 越近）。

  ★ 全部走 iOS 深色令牌（tools/ios_theme.py 是唯一真值）；卡片标 data-round="panel"
    由 gen_ui.py 自动挂圆角九宫格；按钮底色→九宫格图也是自动挂（不用写 data-pic）。
  ⚠️ 本文件只给工具读：看效果请开 probe.preview.html。
  ⚠️ 所有整屏 window 都必须是**普通 window**（modal 是输入黑洞）。
  ⚠️ 页签是"每个页面各带一套"的（窗口是整屏的，浮层会盖住别页的页签）——
     加页签要**四个页面一起加**，漏一个就会出现"某页点不动页签"（踩过）。
  ⚠️ 强度条的 12 段是 div.text（不是 btn）：**只切换 visible、不改底色** ——
     运行时 setBackgroundColor 会清掉 backgroundPic（血案见 ui/main.html 注释），
     而 div.text 没有 picTab，gen_ui 的圆角注入会整段跳过，底色就是干净的直角色块。

  ★ 页签几何：容器 12..468（456 宽），内缩 4 ⇒ 4 段各 107 宽、间隙 6：
     x = 16 / 129 / 242 / 355（末段右边界 462）。文字用短标签（WiFi/蓝牙/局域网/嗅探）。
-->
